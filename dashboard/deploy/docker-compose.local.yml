# 로컬(내 PC)에서 전체 스택을 띄울 때 쓰는 오버레이.
# 서버 배포용 docker-compose.yml과 겹쳐서 사용한다:
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# 차이점: TLS/certbot 없음, nginx가 평문 HTTP로 뜨고 호스트 포트를 직접 연다.
services:
  minio:
    environment:
      # 로컬 콘솔 주소로 리다이렉트해야 로그인 후 화면이 깨지지 않는다
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001

  nginx:
    ports: !override
      - "8000:8000"   # API      → http://localhost:8000
      - "9000:9000"   # MinIO S3 → http://localhost:9000
      - "9001:9001"   # 콘솔     → http://localhost:9001
    volumes: !override
      - ./nginx/templates-local:/etc/nginx/templates:ro
    environment:
      API_DOMAIN: localhost
      MINIO_DOMAIN: localhost
      MINIO_CONSOLE_DOMAIN: localhost
    # 인증서 리로드 루프가 필요 없다
    command: !override ["nginx", "-g", "daemon off;"]

  # 서버가 없어도 Vercel에서 로컬 백엔드를 부를 수 있게 해주는 터널.
  # 계정/도메인/공인 IP 없이 임시 HTTPS 주소를 발급받는다.
  #   docker compose -f docker-compose.yml -f docker-compose.local.yml --profile tunnel up -d cloudflared
  #   docker compose logs cloudflared   ← 여기 찍히는 https://xxxx.trycloudflare.com 주소를 사용
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - nginx
    command: tunnel --no-autoupdate --url http://nginx:8000
