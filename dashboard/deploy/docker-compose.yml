name: samyang-dashboard

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 포트를 호스트에 열지 않는다. 백엔드 컨테이너만 내부 네트워크로 접근한다.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # 콘솔이 로그인 후 리다이렉트할 공개 주소
      MINIO_BROWSER_REDIRECT_URL: https://${MINIO_CONSOLE_DOMAIN}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 버킷 생성 전용 1회성 컨테이너. 이미 있으면 아무것도 하지 않는다(멱등).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - backups:/backups
      - ../../data:/seed:ro
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/rag-documents &&
      mc mb --ignore-existing local/rag-index &&
      mc mb --ignore-existing local/pg-backups &&
      mc ilm rule add --expire-days 30 local/pg-backups 2>/dev/null || true;
      mc ls local
      "

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      # 외부 API 키는 기존 파일을 그대로 재사용한다.
      - ../backend/.env
    environment:
      # env_file 값보다 우선한다. 컨테이너 안에서는 호스트가 postgres다.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX}
      # RAG 서버를 나중에 붙일 때 쓸 값. 지금은 참고용으로만 넣어둔다.
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    # 포트를 호스트에 열지 않는다. 외부 노출은 전부 nginx가 담당한다.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - minio
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      MINIO_DOMAIN: ${MINIO_DOMAIN}
      MINIO_CONSOLE_DOMAIN: ${MINIO_CONSOLE_DOMAIN}
      CERT_NAME: ${API_DOMAIN}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot
    # 인증서가 갱신되면 nginx도 다시 읽어야 한다.
    command: >
      /bin/sh -c "
      while :; do sleep 12h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'
      "

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    # 서버 배포용. 로컬(docker-compose.local.yml)에서는 뜨지 않는다.
    profiles: ["prod"]
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    # 12시간마다 갱신 시도. 만료 30일 전부터만 실제로 갱신된다.
    entrypoint: >
      /bin/sh -c "
      trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done
      "

volumes:
  pgdata:
  miniodata:
  backups:
  certbot-conf:
  certbot-www:
